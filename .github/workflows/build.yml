name: Build Price Alert app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PriceAlert.apk
          gh release create "build-${{ github.run_number }}-${{ github.run_attempt }}" PriceAlert.apk \
            --title "Price Alert – build ${{ github.run_number }}" \
            --notes "On your phone: tap PriceAlert.apk below to download, then open it to install."
